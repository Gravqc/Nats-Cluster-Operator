              rule: self.version.split('.')[0] == oldSelf.version.split('.')[0] &&
                self.version.split('.')[1] == oldSelf.version.split('.')[1] && int(self.version.split('.')[2])
                >= int(oldSelf.version.split('.')[2])
          status:
